<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vault</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vault">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="https://i.ibb.co/W4XT2hgc/apple-touch-icon.png">
<link rel="icon" href="https://i.ibb.co/GfkKpsQ0/icon-192.png">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Vault%22%2C%22short_name%22%3A%22Vault%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23ffffff%22%2C%22theme_color%22%3A%22%23ffffff%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A//i.ibb.co/GfkKpsQ0/icon-192.png%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image/png%22%7D%2C%7B%22src%22%3A%22https%3A//i.ibb.co/7Jgqk1SF/icon-512.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image/png%22%7D%5D%7D">
<style>
:root{--bg:#fff;--ink:#111827;--mute:#6b7280;--line:#eceff3;--soft:#f5f7fa;--blue:#1f6fef;--red:#e5412d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif;touch-action:manipulation;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{padding:16px 20px 12px}
h1{margin:0 0 14px;font-size:32px;font-weight:800;letter-spacing:-.03em}
.stor{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:var(--soft);border-radius:18px;padding:14px 16px;color:var(--ink)}
.ring{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--blue) var(--p,0%),#dfe5ee 0)}
.ring::after{content:"";width:34px;height:34px;border-radius:50%;background:var(--soft)}
.stor b{display:block;font-size:17px}.stor span{font-size:13px;color:var(--mute);font-weight:500}
.stor .go{margin-left:auto;color:var(--mute);font-size:22px}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 20px 130px}
.cat{margin-top:10px}
.ch{width:100%;display:flex;align-items:center;gap:12px;padding:12px 0;color:var(--ink);border-radius:0;font-weight:700;font-size:18px}
.ch:active{background:none}
.dot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:15px;font-weight:800;flex:none}
.ch small{margin-left:auto;font-size:13px;color:var(--mute);font-weight:500}
.chev{width:10px;height:10px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(-45deg);transition:transform .2s;margin-left:4px;flex:none}
.cat.open .chev{transform:rotate(45deg)}
.body{display:none;border-top:1px solid var(--line)}
.cat.open .body{display:block}
.file{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.th{width:44px;height:44px;border-radius:10px;background:var(--soft);flex:none;overflow:hidden;display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--mute);text-transform:uppercase}
.th img{width:100%;height:100%;object-fit:cover}
.meta{flex:1;min-width:0}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:13px;color:var(--mute)}
button{font:inherit;border:0;background:none;cursor:pointer}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--blue);background:var(--soft)}
.ib.del{color:var(--red)}
.ib:active{opacity:.6}
.empty{text-align:center;color:var(--mute);padding:70px 20px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 20px calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.up{width:100%;background:var(--blue);color:#fff;padding:15px;border-radius:16px;font-size:17px;font-weight:700}
.up:active{background:#1859c4}
.prog{height:4px;background:var(--soft);border-radius:4px;overflow:hidden;margin-bottom:10px;display:none}
.prog i{display:block;height:100%;width:0;background:var(--blue);transition:width .2s}
.ov{position:fixed;inset:0;background:rgba(17,24,39,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:26px 26px 0 0;padding:12px 22px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:6;max-height:85%;overflow-y:auto}
.sheet.on{transform:none}
.grab{width:40px;height:5px;background:#dfe3e9;border-radius:3px;margin:0 auto 16px}
.sheet h2{margin:0 0 4px;font-size:22px}
.big{font-size:34px;font-weight:800;letter-spacing:-.03em;margin:10px 0 2px}
.track{height:10px;background:var(--soft);border-radius:6px;overflow:hidden;display:flex;margin:12px 0 6px}
.track i{display:block;height:100%}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.row .dot{width:12px;height:12px;border-radius:4px}
.row em{margin-left:auto;font-style:normal;color:var(--mute)}
.modal{position:fixed;left:24px;right:24px;top:50%;background:#fff;border-radius:22px;padding:24px 22px 18px;text-align:center;transform:translateY(-50%) scale(.92);opacity:0;pointer-events:none;transition:.2s;z-index:7}
.modal.on{opacity:1;transform:translateY(-50%) scale(1);pointer-events:auto}
.modal .wi{width:52px;height:52px;border-radius:50%;background:#fdecea;color:var(--red);display:grid;place-items:center;margin:0 auto 12px;font-size:26px;font-weight:800}
.modal h3{margin:0 0 6px;font-size:20px}
.modal p{margin:0 0 18px;color:var(--mute);font-size:15px;word-break:break-word}
.modal .acts{display:flex;gap:10px}
.modal .acts button{flex:1;padding:14px;border-radius:14px;font-weight:700;font-size:16px}
.cancel{background:var(--soft);color:var(--ink)}
.kill{background:var(--red);color:#fff}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-90px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;transition:transform .25s;max-width:90%;z-index:9}
.toast.on{transform:translate(-50%,0)}
input[type=file]{display:none}
</style>
</head>
<body>
<header>
  <h1>Vault</h1>
  <button class="stor" id="storbtn">
    <div class="ring" id="ring"></div>
    <div><b id="sTitle">Storage</b><span id="sSub">Loading…</span></div>
    <div class="go">›</div>
  </button>
</header>
<main id="list"></main>
<div class="bar">
  <div class="prog" id="prog"><i id="progbar"></i></div>
  <button class="up" id="upbtn">Upload files</button>
  <input type="file" id="pick" multiple>
</div>

<div class="ov" id="ov"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <h2>Storage</h2>
  <div class="big" id="bigUsed">0 MB</div>
  <div class="sub" id="bigOf"></div>
  <div class="track" id="track"></div>
  <div id="breakdown"></div>
  <div class="sub" style="margin-top:14px" id="limitNote"></div>
</div>
<div class="modal" id="modal">
  <div class="wi">!</div>
  <h3>Delete this file?</h3>
  <p id="mName"></p>
  <div class="acts"><button class="cancel" id="mNo">Cancel</button><button class="kill" id="mYes">Delete</button></div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://pukvvjxtutvvdmoxvpvz.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB1a3Z2anh0dXR2dmRtb3h2cHZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyOTgzMzMsImV4cCI6MjEwNjg3NDMzM30.J9HccNOKM7xGI__7ehOnJwAa2pDnwxWmkVUgICEaAYM";
const BUCKET = "files";
const MAX_FILE_MB = 50;      // biggest single file
const TOTAL_MB = 1024;       // total storage shown in the meter (Supabase free = 1 GB)

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);

["gesturestart","gesturechange","gestureend"].forEach(e => document.addEventListener(e, ev => ev.preventDefault()));
let lastTouch = 0;
document.addEventListener("touchend", ev => { const n = Date.now(); if (n - lastTouch < 350) ev.preventDefault(); lastTouch = n; }, {passive:false});

const CATS = [
  {id:"img", name:"Images",    letter:"I", color:"#1f6fef", ext:"jpg jpeg png gif webp heic heif svg bmp"},
  {id:"vid", name:"Videos",    letter:"V", color:"#8b5cf6", ext:"mp4 mov m4v webm avi mkv"},
  {id:"aud", name:"Audio",     letter:"A", color:"#f59e0b", ext:"mp3 m4a wav aac flac ogg"},
  {id:"doc", name:"Documents", letter:"D", color:"#10b981", ext:"pdf doc docx txt rtf xls xlsx csv ppt pptx pages numbers key md"},
  {id:"zip", name:"Archives",  letter:"Z", color:"#64748b", ext:"zip rar 7z tar gz"},
  {id:"oth", name:"Other",     letter:"O", color:"#ec4899", ext:""}
];
const catOf = n => { const e=(n.split(".").pop()||"").toLowerCase(); return CATS.find(c=>c.ext.split(" ").includes(e)) || CATS[5]; };
const openState = {};
let FILES = [], pendingDelete = null;

const esc = s => s.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const show = n => n.replace(/^\d+-/,"");
function size(b){b=b||0;const u=["B","KB","MB","GB"];let i=0;while(b>=1024&&i<3){b/=1024;i++}return (i>1?b.toFixed(1):Math.round(b))+" "+u[i]}
const when = d => d ? new Date(d).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}) : "";
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),2600)}

function layer(sheet, modal){
  $("ov").classList.toggle("on", sheet||modal);
  $("sheet").classList.toggle("on", sheet);
  $("modal").classList.toggle("on", modal);
}
$("ov").onclick = () => layer(false,false);
$("storbtn").onclick = () => layer(true,false);
$("mNo").onclick = () => layer(false,false);

function render(){
  const total = FILES.reduce((s,f)=>s+f.size,0);
  const pct = Math.min(100, total/(TOTAL_MB*1048576)*100);
  $("ring").style.setProperty("--p", pct+"%");
  $("sTitle").textContent = "Storage";
  $("sSub").textContent = FILES.length+" file"+(FILES.length===1?"":"s")+" · "+size(total)+" used";
  $("bigUsed").textContent = size(total);
  $("bigOf").textContent = "of "+size(TOTAL_MB*1048576)+" · "+FILES.length+" files";
  $("limitNote").textContent = "Largest single file: "+MAX_FILE_MB+" MB.";
  const groups = CATS.map(c=>({c, items:FILES.filter(f=>catOf(f.name)===c)})).filter(g=>g.items.length);
  $("track").innerHTML = groups.map(g=>`<i style="width:${g.items.reduce((s,f)=>s+f.size,0)/(TOTAL_MB*1048576)*100}%;background:${g.c.color}"></i>`).join("");
  $("breakdown").innerHTML = groups.length ? groups.map(g=>`<div class="row"><span class="dot" style="background:${g.c.color}"></span>${g.c.name}<em>${g.items.length} · ${size(g.items.reduce((s,f)=>s+f.size,0))}</em></div>`).join("") : '<div class="sub">Nothing stored yet.</div>';
  if(!FILES.length){$("list").innerHTML='<div class="empty">No files yet.<br>Tap Upload files to add one.</div>';return}
  $("list").innerHTML = groups.map(g=>{
    const isOpen = openState[g.c.id] !== false;
    return `<section class="cat ${isOpen?"open":""}" data-cat="${g.c.id}">
      <button class="ch" data-toggle="${g.c.id}"><span class="dot" style="background:${g.c.color}">${g.c.letter}</span>${g.c.name}
        <small>${g.items.length} · ${size(g.items.reduce((s,f)=>s+f.size,0))}</small><span class="chev"></span></button>
      <div class="body">${g.items.map(f=>{
        const ext=(f.name.split(".").pop()||"").slice(0,4);
        const thumb = g.c.id==="img" ? `<img loading="lazy" src="${sb.storage.from(BUCKET).getPublicUrl(f.name).data.publicUrl}" onerror="this.remove()">` : "";
        return `<div class="file"><div class="th">${thumb||esc(ext)}</div>
          <div class="meta"><div class="name">${esc(show(f.name))}</div><div class="sub">${size(f.size)} · ${when(f.date)}</div></div>
          <button class="ib" data-dl="${esc(f.name)}" aria-label="Download"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg></button>
          <button class="ib del" data-rm="${esc(f.name)}" aria-label="Delete"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button></div>`}).join("")}</div></section>`}).join("");
}

async function load(){
  const {data,error} = await sb.storage.from(BUCKET).list("",{limit:500,sortBy:{column:"created_at",order:"desc"}});
  if(error){$("list").innerHTML='<div class="empty">Could not load files.<br>'+esc(error.message)+'</div>';$("sSub").textContent="Error";return}
  FILES = data.filter(f=>f.name!==".emptyFolderPlaceholder").map(f=>({name:f.name,size:(f.metadata&&f.metadata.size)||0,date:f.created_at}));
  render();
}

$("upbtn").onclick = () => $("pick").click();
$("pick").onchange = async e => {
  const files=[...e.target.files]; if(!files.length)return;
  $("prog").style.display="block"; let done=0, ok=0;
  for(const f of files){
    if(f.size > MAX_FILE_MB*1048576){ toast(f.name+" is over "+MAX_FILE_MB+" MB"); }
    else{
      const path = Date.now()+"-"+f.name.replace(/[^\w.\-]+/g,"_");
      const {error}=await sb.storage.from(BUCKET).upload(path,f,{contentType:f.type||undefined});
      error ? toast("Failed: "+error.message) : ok++;
    }
    done++; $("progbar").style.width=(done/files.length*100)+"%";
  }
  setTimeout(()=>{$("prog").style.display="none";$("progbar").style.width="0"},400);
  e.target.value=""; if(ok) toast(ok+" file"+(ok>1?"s":"")+" uploaded"); load();
};

$("list").onclick = async e => {
  const t = e.target.closest("button"); if(!t)return;
  if(t.dataset.toggle){ const s=t.parentElement; s.classList.toggle("open"); openState[t.dataset.toggle]=s.classList.contains("open"); return }
  if(t.dataset.rm){ pendingDelete=t.dataset.rm; $("mName").textContent=show(pendingDelete); layer(false,true); return }
  if(t.dataset.dl){
    const dl=t.dataset.dl; toast("Downloading…");
    const {data,error}=await sb.storage.from(BUCKET).download(dl);
    if(error)return toast(error.message);
    const file=new File([data],show(dl),{type:data.type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ try{await navigator.share({files:[file]})}catch(_){} return }
    const a=document.createElement("a");a.href=URL.createObjectURL(data);a.download=show(dl);document.body.appendChild(a);a.click();a.remove();
  }
};
$("mYes").onclick = async () => {
  const n=pendingDelete; layer(false,false); if(!n)return;
  const {error}=await sb.storage.from(BUCKET).remove([n]);
  error ? toast(error.message) : (toast("File deleted"), load());
};
load();
</script>
</body>
</html>
